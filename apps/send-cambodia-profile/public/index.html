<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Send Cambodia · Team Work Style Profile</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Kantumruy+Pro:wght@400;500;600;700&family=Koulen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F0; --ink:#17150F; --muted:#6A6458; --line:#E3DCCF; --card:#FFFFFF;
  --accent:#1F44FF; --accent-text:#1F44FF; --on-accent:#FFFFFF; --soft:#E9ECFF;
  --pp:#FF5C3C; --sr:#E6B800; --po:#6FA800; --other:#1F44FF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#F3F3F1; --muted:#9A9994; --line:#262626; --card:#0E0E0E;
    --accent:#1F44FF; --accent-text:#8A9CFF; --on-accent:#FFFFFF; --soft:#0B1440;
    --pp:#FF5C3C; --sr:#FFDD00; --po:#B6FF1A; --other:#6F86FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#F3F3F1; --muted:#9A9994; --line:#262626; --card:#0E0E0E;
  --accent:#1F44FF; --accent-text:#8A9CFF; --on-accent:#FFFFFF; --soft:#0B1440;
  --pp:#FF5C3C; --sr:#FFDD00; --po:#B6FF1A; --other:#6F86FF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:26px;height:26px;color:var(--accent-text)}
.brand b{font-family:Archivo,sans-serif;font-weight:800;font-size:15px;letter-spacing:.01em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.p{display:block}
.s{display:block;color:var(--muted);font-size:.82em;line-height:1.45}
.inline .p,.inline .s{display:inline}
.inline .s::before{content:" · ";}
h1{margin:8px 0 6px;font-weight:400;line-height:1.15}
h1 .p{font-size:44px}
h1 .p.km{font-family:Koulen,"Kantumruy Pro",sans-serif}
h1 .p.en{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.02em}
h1 .s{font-size:18px;margin-top:6px;font-family:inherit}
h2{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;margin:28px 0 10px;line-height:1.25}
h2 .p.km{font-family:Koulen,sans-serif;font-weight:400;font-size:24px}
.lede{max-width:34em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;background:var(--accent);color:var(--on-accent);font-weight:600;min-height:52px}
.btn .s{color:rgba(255,255,255,.8)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost .s{color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-col{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-top:22px}
.btn-col .btn{flex-direction:column;gap:0;text-align:center}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.traits-intro{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.chip-trait{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.chip-trait .p{font-weight:600}
/* signature mini-bars */
.sig{display:flex;align-items:flex-end;gap:3px;height:34px}
.sig i{display:block;width:7px;border-radius:2px;background:var(--accent);min-height:3px}
.sig.big{height:72px;gap:8px}
.sig.big i{width:22px;border-radius:4px}
/* form */
label.f{display:block;margin:16px 0 6px;font-weight:600}
input[type=text],select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.campus-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.campus-pick button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center}
.campus-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
/* question */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.qcount{font-family:Archivo,sans-serif;font-size:14px;color:var(--muted)}
.qtext{min-height:150px;display:flex;flex-direction:column;justify-content:center;margin:18px 0}
.qtext .p{font-size:25px;line-height:1.5;font-weight:500}
.qtext .s{font-size:16px;margin-top:10px}
.scale{display:flex;flex-direction:column;gap:8px}
.scale button{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;min-height:58px}
.scale button .n{font-family:Archivo,sans-serif;font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex:none;font-size:14px}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.scale button[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qnav{display:flex;justify-content:space-between;margin-top:16px}
.link{background:none;border:0;color:var(--accent-text);padding:10px 0;font-weight:600}
/* results bars */
.bars{display:flex;flex-direction:column;gap:20px;margin-top:8px}
.bar-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar-h .nm{font-weight:600}
.bar-h .sc{font-family:Archivo,sans-serif;font-weight:800;font-size:20px}
.track{position:relative;height:12px;border-radius:6px;background:var(--line);margin:8px 0 6px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.track .avg{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);line-height:1.35}
.ends span:last-child{text-align:right}
.ends .on{color:var(--ink);font-weight:600}
.summary{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:18px 0}
.saved{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--soft);margin:14px 0}
.saved.warn{background:transparent;border:1.5px dashed var(--line)}
/* team */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.filters button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avgcard{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card)}
.legend{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}
.legend span{width:22px;text-align:center}
.people{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.people li{border-bottom:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 2px;text-align:left}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--muted);font-size:13px}
.detail{padding:4px 2px 22px}
.detail .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.owner-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.small-btn{border:1.5px solid var(--line);background:none;border-radius:10px;padding:8px 12px;font-size:14px}
.small-btn.danger{border-color:var(--pp);color:var(--pp)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;margin-top:16px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.ptag{font-family:Archivo,sans-serif;font-size:13px;color:var(--accent-text);font-weight:600}
.ask{font-size:15px;color:var(--muted);margin-top:14px}
.bar-row{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:10px}
.bar-row .lbl{font-size:12px;color:var(--muted);line-height:1.2}
.bar-row .num{font-family:Archivo,sans-serif;font-weight:800;font-size:15px;text-align:right}
.bar-row .track{margin:4px 0}
.track.job .fill{background:repeating-linear-gradient(135deg,var(--accent-text) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.gap{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.gap.big{background:var(--pp);border-color:var(--pp);color:#140400}
.stretch-badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--pp);color:#140400;font-weight:600;white-space:nowrap}
.key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:6px 0 4px;flex-wrap:wrap}
.key i{display:inline-block;width:22px;height:10px;border-radius:5px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.key i.j{background:repeating-linear-gradient(135deg,var(--accent-text) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.sortbar{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin:14px 0 0}
.sortbar button{border:0;background:none;padding:4px 8px;border-radius:8px;font-size:14px}
.sortbar button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:600}
.fitbox{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;background:var(--card)}
h3{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;margin:0;line-height:1.3}
h3 .p.km{font-family:Koulen,sans-serif;font-weight:400;font-size:20px}
.fitpill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-top:4px;margin-right:4px}
.fitpill.good{background:var(--accent);color:#fff}
.fitpill.mid{border:1.5px solid var(--accent-text);color:var(--accent-text)}
.fitpill.bad{background:var(--pp);color:#140400}
.fitrows{display:flex;flex-direction:column;gap:10px}
.fitrow{border-left:4px solid var(--line);padding:2px 0 2px 12px}
.fitrow.fit{border-color:var(--accent)}
.fitrow.near{border-color:var(--accent-text);border-left-style:dashed}
.fitrow.stretch{border-color:var(--pp)}
.fr-top{display:flex;justify-content:space-between;gap:10px}
.fr-top .st{font-size:13px;font-weight:600}
.fitrow.stretch .st{color:var(--pp)}
.fr-nums{font-size:13px;color:var(--muted);font-family:Archivo,"Kantumruy Pro",sans-serif}
.fr-why{font-size:14px;margin-top:2px}
.fr-why .s{font-size:12px}
.lanes{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.lane-card{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.needs span{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--muted)}
.lane-sub{font-size:13px;color:var(--muted);margin:12px 0 4px}
.lane-person{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;text-align:left}
.lane-person small{display:block;color:var(--muted);font-size:12px}
.lane-empty{font-size:14px;color:var(--muted);padding:6px 0}
.campus-pick button .p{font-size:15px;line-height:1.35}
.ci-group{margin-top:18px}
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ci-cell{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ci-cell input{width:100%;font:inherit;font-size:18px;font-family:Archivo,sans-serif;font-weight:600;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.ci-upload{display:flex;flex-direction:column;gap:10px;margin:16px 0;padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.ci-upload{cursor:pointer;align-items:flex-start}
.ci-upload .up-t{font-weight:600}
.ci-upload input{font-size:15px;max-width:100%}
.ci-upload.busy{opacity:.6}
.ci-read{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-family:Archivo,'Kantumruy Pro',sans-serif;font-size:15px}
.ci-read .lbl{width:100%;font-size:13px;color:var(--muted);font-family:'Kantumruy Pro',sans-serif}
.srcpill{display:inline-block;vertical-align:middle;font-family:"Kantumruy Pro",sans-serif;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
/* team shape + compare */
:root{--c1:#1F44FF;--c2:#FF5C3C;--c3:#0E9F6E;--c4:#B8860B;--c5:#9B3FD1;--c6:#00A3C4;--c7:#D6336C;--c8:#5C6B00;--c9:#E8590C;--c10:#2B8A3E;--c11:#5F3DC4;--c12:#0B7285}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#6F86FF;--c2:#FF7A5E;--c3:#34D399;--c4:#FFDD00;--c5:#C084FC;--c6:#38D5F2;--c7:#F472B6;--c8:#B6FF1A;--c9:#FFA94D;--c10:#69DB7C;--c11:#B197FC;--c12:#66D9E8}}
:root[data-theme="dark"]{--c1:#6F86FF;--c2:#FF7A5E;--c3:#34D399;--c4:#FFDD00;--c5:#C084FC;--c6:#38D5F2;--c7:#F472B6;--c8:#B6FF1A;--c9:#FFA94D;--c10:#69DB7C;--c11:#B197FC;--c12:#66D9E8}
.insights{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.insight{overflow-wrap:anywhere;border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px 14px;background:var(--card)}
.insight.str{border-left-color:var(--accent)}
.insight.blind{border-left-color:var(--pp)}
.insight.job{border-left-color:var(--muted);border-left-style:dashed}
.insight .ih{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.insight ul{margin:4px 0 0;padding-left:18px;font-size:15px}
.insight li{margin:2px 0}
.strip .bar-h .sc{font-family:Archivo,"Kantumruy Pro",sans-serif}
.who-ends,.cmp-nums,.people-key{overflow-wrap:anywhere}
.strips{display:flex;flex-direction:column;gap:22px;margin-top:18px}
.strip .bar-h{margin-bottom:2px}
.strip-field{position:relative;margin:6px 13px 4px}
.strip-field .rail{position:absolute;left:-13px;right:-13px;height:4px;border-radius:2px;background:var(--line)}
.strip-field .avgline{position:absolute;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.pdot{position:absolute;width:26px;height:26px;margin-left:-13px;border-radius:50%;display:grid;place-items:center;font-family:Archivo,"Kantumruy Pro",sans-serif;font-size:10.5px;font-weight:800;color:#fff;border:2px solid var(--bg);padding:0;line-height:1}
.pdot.me{box-shadow:0 0 0 2px var(--ink)}
.who-ends{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:4px}
.who-ends span:last-child{text-align:right}
.people-key{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:12px 0 0}
.people-key span{display:inline-flex;align-items:center;gap:6px}
.people-key i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.pick button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.pick button i{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--line)}
.pick button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.cmp-track{position:relative;height:30px;margin:4px 13px}
.cmp-track .rail{position:absolute;left:-13px;right:-13px;top:13px;height:4px;border-radius:2px;background:var(--line)}
.cmp-nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-family:Archivo,"Kantumruy Pro",sans-serif}
.cmp-nums span{display:inline-flex;align-items:center;gap:5px}
.cmp-nums i{width:10px;height:10px;border-radius:50%;display:inline-block}
.segmented{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0}
.segmented button{border:0;background:none;padding:5px 12px;font-size:13px}
.segmented button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.talk{padding-left:18px;margin:8px 0 0}.talk li{margin:8px 0}
.back{background:none;border:0;color:var(--accent-text);font-weight:600;padding:2px 0 12px;font-size:16px}
.hide{display:none!important}
@media (max-width:420px){ h1 .p{font-size:36px} .qtext .p{font-size:22px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="3.8" y1="7.2" x2="20.2" y2="16.8"/><line x1="3.8" y1="16.8" x2="20.2" y2="7.2"/></g></svg>
      <b>The Send Cambodia</b>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="km" aria-pressed="true">ខ្មែរ</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script src="/platform.js"></script>
<script>
/* ---------- content ---------- */
const TRAITS = [
  {k:'ini', en:'Initiative', km:'ការផ្តួចផ្តើម', lo:['Supportive team player','អ្នកគាំទ្រក្រុម'], hi:['Independent self-starter','ផ្តួចផ្តើមដោយខ្លួនឯង']},

async function pdfToImage(file){

}
async function parseCIPdf(lib, bytes){
  const doc = await lib.getDocument({data: bytes, isEvalSupported:false, verbosity:0}).promise;
  const page = await doc.getPage(1);
  const [ol, tc] = await Promise.all([page.getOperatorList(), page.getTextContent()]);
  const OPS = lib.OPS;
  const REF = {A:[183,0,42], B:[253,202,0], C:[0,66,185], D:[0,150,64], L:[126,42,151], I:[90,177,229]};
  const toRGB = c => { if(typeof c==='string' && c[0]==='#'){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; } return c ? Array.from(c).slice(0,3) : null; };
  const near = (a,b) => a && b && Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]) < 40;
  const X0 = 159, UNIT = 40; // chart origin and one scale step, in the report's drawing units
  const val = x => Math.round(((x - X0)/UNIT)*4)/4;
  let fillc=null, strokec=null, last=null;
  const dots=[], arrows=[];
  for(let i=0;i<ol.fnArray.length;i++){
    const f=ol.fnArray[i], a=ol.argsArray[i];
    if(f===OPS.setFillRGBColor) fillc=toRGB(a.length===1?a[0]:a);
    else if(f===OPS.setStrokeRGBColor) strokec=toRGB(a.length===1?a[0]:a);
    else if(f===OPS.constructPath) last=a;
    else if((f===OPS.fillStroke || f===OPS.stroke || f===OPS.fill) && last){
      const ops=last[0], args=last[1];
      const xs=[], ys=[]; for(let k=0;k+1<args.length;k+=2){ xs.push(args[k]); ys.push(args[k+1]); }
      if(!xs.length) continue;
      const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
      const isCurve = ops.includes(OPS.curveTo);
      if(f===OPS.fillStroke && isCurve){
        const row = Object.keys(REF).find(k=>near(fillc,REF[k]));
        if(row) dots.push({row, x:(minx+maxx)/2});
      } else if(f!==OPS.fill && !isCurve && near(strokec,[255,0,0]) && Math.abs(maxx-minx)<1 && (maxy-miny)>50){
        arrows.push(minx);
      }
    }
  }
  const pick = start => { const o={}; dots.slice(start,start+6).forEach(d=>{ o[d.row]=val(d.x); }); return o; };
  const traits = pick(0), job = pick(6);
  const items = tc.items.filter(it=>it.str && it.str.trim());
  const size = it => Math.round(Math.hypot(it.transform[0], it.transform[1]));
  const big = Math.max(...items.map(size));
  const name = items.filter(it=>size(it)===big && /^[\p{L}][\p{L}'’.\-]*$/u.test(it.str.trim())).map(it=>it.str.trim()).join(' ');
  const skip = new Set(['Survey','Traits','Job','Behaviors']);
  const pat = items.find(it=>size(it)===18 && !skip.has(it.str.trim()));
  const ok = o => ['A','B','C','D','L','I'].every(k=>typeof o[k]==='number' && o[k]>=-0.3 && o[k]<=10.3);
  return {
    ok: dots.length>=6 && ok(traits),
    name, pattern: pat ? pat.str.trim() : '',
    traits, job: ok(job)?job:null,
    traitsArrow: arrows[0]!=null ? val(arrows[0]) : null,
    jobArrow: arrows[1]!=null ? val(arrows[1]) : null,
  };
}

function applyRead(out){
  const ok = v => typeof v==='number' && v>=-0.3 && v<=10.3;
  const fmt = v => String(Math.round(Math.min(10,Math.max(0,v))*4)/4);
  for(const key of ['traits','job']) for(const r of CI_ROWS){ const v=out?.[key]?.[r.l]; ci[key][r.l] = ok(v) ? fmt(v) : ''; }
  ci.traitsArrow = ok(out?.traitsArrow) ? fmt(out.traitsArrow) : '';

}
async function readWithClaude(img){
  const prompt = `The image is page 1 of a Culture Index report. Near the top left is the person's name, and under it may be a pattern name such as "Daredevil". The page has two charts: "Survey Traits" and "Job Behaviors". Each chart has rows A, B, C and D in the upper box and rows L and I in the lower box, all on a 0 to 10 scale shown along the top of each box. Each row has one coloured dot; read where the centre of each dot sits on the scale, to the nearest 0.5. Each chart also has a vertical red arrow in the upper box; read its position on the same scale, to the nearest 0.5. Reply with JSON only, in exactly this shape, using null for anything you cannot read clearly:
{"name":"","pattern":"","traits":{"A":0,"B":0,"C":0,"D":0,"L":0,"I":0},"traitsArrow":0,"job":{"A":0,"B":0,"C":0,"D":0,"L":0,"I":0},"jobArrow":0}`;
  return await sample.json(prompt, {images:[img], modelTier:'default'});
}
async function readReport(){
  if(!ciFile) return;
  ciStatus='reading'; ciErr=''; ciEdit=false; render();
  const isPdf = ciFile.type==='application/pdf' || /\.pdf$/i.test(ciFile.name);
  try{
    if(isPdf){
      let bytes;
      try{ await loadPdfJs(); bytes = new Uint8Array(await ciFile.arrayBuffer()); }
      catch(e){ ciStatus='error'; ciErr='pdf'; render(); return; }
      // 1) Read the chart drawing directly from the PDF: exact, and needs no permission.
      try{ const r = await parseCIPdf(window.pdfjsLib, bytes.slice()); if(r.ok){ applyRead(r); ciStatus='read'; render(); return; } }catch(e){}
      // 2) Different layout: render page 1 and ask Claude to read the picture.
      if(!sample || !canImages){ ciStatus='error'; ciErr='layout'; render(); return; }
      const img = await pdfToImage(new Blob([bytes],{type:'application/pdf'}));
      applyRead(await readWithClaude(img));
    } else {
      if(!sample || !canImages){ ciStatus='error'; ciErr='noimg'; render(); return; }
      applyRead(await readWithClaude(ciFile));
    }
    if(ciComplete(ci.traits)){ ciStatus='read'; } else { ciStatus='error'; ciErr='incomplete'; }
  }catch(e){ ciStatus='error'; ciErr=e?.code==='not_granted'?'denied':'read'; }
  render();
}
async function saveCI(){
  if(!ciCanSave()) return;
  const rec={name:form.name.trim().slice(0,60), lane:form.lane, role:'', source:'ci',
    scores:ciMap(ci.traits, ci.traitsArrow),
    ci:{traits:{...ci.traits}, job:{...ci.job}, traitsArrow:ci.traitsArrow, jobArrow:ci.jobArrow, pattern:ci.pattern.trim().slice(0,40)}, updatedAt:Date.now()};
  // Job behaviors use the traits arrow too, so the gap between the two charts stays as Culture Index draws it.
  if(ciComplete(ci.job)) rec.jobScores = ciMap(ci.job, ci.traitsArrow);
  const id = form.forOther ? ('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)) : myId;
  lastResult={id:id||'local',...rec};
  saveState='local';
  if(db && id){ try{ await db.collection('results').doc(id).set(rec); saveState='saved'; }catch(err){ saveState='failed'; } }
  go('mine');
}
function srcTag(r){ return r.source==='ci' ? ` <span class="srcpill">Culture Index${r.ci?.pattern?' · '+esc(r.ci.pattern):''}</span>` : ''; }

/* ---------- routing ---------- */
function go(v){
  view=v;
  if((location.hash.slice(1)||'home')!==v){ location.hash=v; } // adds a history entry, so the phone's back gesture works
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1)||'home'; if(['take','team','mine','home'].includes(h) && h!==view){ view=h; if(h==='take' && stage==='info' && !form.lane && !form.name){ /* fresh */ } render(); window.scrollTo(0,0); } });
function back(){
  if(view==='take'){
    if(stage==='q1'){ if(qi>0){ qi--; } else { stage='info'; } render(); return; }
    if(stage==='q2'){ if(qi>0){ qi--; } else { stage='break'; } render(); return; }
    if(stage==='break'){ stage='q1'; qi=ITEMS.length-1; render(); return; }
    go('home'); return;
  }
  if(view==='team' && openId){ openId=null; confirmDel=null; render(); return; }
  go('home');
}

function barsHTML(r, avg){
  const sc=r.scores, js=r.jobScores, g=gaps(r);

  return key+`<div class="bars">${TRAITS.map(t=>{ const v=sc[t.k]; const sd=side(v);
    const gv=g?g[t.k]:null;
    return `<div>
      <div class="bar-h"><span class="nm">${L(t.en,t.km)}</span>${g?`<span class="gap${Math.abs(gv)>=BIG_GAP?' big':''}" title="Job minus natural">${fmtGap(gv)}</span>`:`<span class="sc">${v.toFixed(1)}</span>`}</div>

      <div class="bar-row"><span class="lbl">${one('Job','ការងារ')}</span><div class="track job" role="img" aria-label="${t.en} job ${js[t.k]} of 10"><span class="fill" style="width:${js[t.k]*10}%"></span></div><span class="num">${js[t.k].toFixed(1)}</span></div>`
      :`<div class="track" role="img" aria-label="${t.en} ${v} of 10"><span class="fill" style="width:${v*10}%"></span>${avg?`<span class="avg" style="left:calc(${avg[t.k]*10}% - 1px)"></span>`:''}</div>`}
      <div class="ends"><span class="${sd==='lo'?'on':''}">${one(t.lo[0],t.lo[1])}</span><span class="${sd==='hi'?'on':''}">${one(t.hi[0],t.hi[1])}</span></div>
    </div>`; }).join('')}</div>`;

function summaryHTML(r){
  const sc=r.scores;
  const sorted=[...TRAITS].sort((a,b)=>sc[b.k]-sc[a.k]);
  const top=sorted.slice(0,2), low=sorted[sorted.length-1];
  let en=`Naturally strongest: ${top.map(t=>`<b>${t.en}</b> (${t.hi[0].toLowerCase()})`).join(' and ')}. Lowest: <b>${low.en}</b>, leaning ${low.lo[0].toLowerCase()}.`;
  let km=`ខ្លាំងបំផុតតាមធម្មជាតិ៖ ${top.map(t=>`<b>${t.km}</b> (${t.hi[1]})`).join(' និង ')}។ ទាបបំផុត៖ <b>${low.km}</b> ដែលទំនោរទៅរក ${low.lo[1]}។`;
  const g=gaps(r);
  if(g){
    const big=[...TRAITS].filter(t=>Math.abs(g[t.k])>=BIG_GAP).sort((a,b)=>Math.abs(g[b.k])-Math.abs(g[a.k]));
    if(big.length){
      en+=` <br><br>Biggest stretch: ${big.slice(0,3).map(t=>`<b>${t.en}</b>. Your job pulls you toward “${(g[t.k]>0?t.hi[0]:t.lo[0]).toLowerCase()}” more than comes naturally`).join('. ')}. A big stretch is worth talking about. It can mean extra energy spent every day, or a task that someone else could carry.`;
      km+=` <br><br>កន្លែងប្រឹងប្រែងខ្លាំងបំផុត៖ ${big.slice(0,3).map(t=>`<b>${t.km}</b>។ ការងាររបស់អ្នកទាញអ្នកឲ្យទៅរក «${g[t.k]>0?t.hi[1]:t.lo[1]}» ច្រើនជាងលក្ខណៈធម្មជាតិរបស់អ្នក`).join('។ ')}។ ការប្រឹងប្រែងខ្លាំងគួរតែយកមកពិភាក្សា។ វាអាចមានន័យថា អ្នកចំណាយកម្លាំងបន្ថែមរាល់ថ្ងៃ ឬមានកិច្ចការដែលអ្នកផ្សេងអាចជួយទទួលខុសត្រូវបាន។`;
    } else {
      en+=` <br><br>Your job and your natural style line up fairly closely. No trait is stretched by ${BIG_GAP} or more.`;
      km+=` <br><br>ការងាររបស់អ្នក និងលក្ខណៈធម្មជាតិរបស់អ្នក ស៊ីគ្នាល្អ។ គ្មានចំណុចណាមួយខុសគ្នាដល់ ${BIG_GAP} ឬលើសនោះទេ។`;
    }
  }
  return `<div class="summary">${L(en,km)}</div>`;
}

}

/* ---------- team shape + compare ---------- */
const HI = 6.5, LO = 3.5;
function byName(list){ return [...list].sort((a,b)=>displayName(a).localeCompare(displayName(b))); }
function colorOf(r){ const i=byName(results).findIndex(x=>x.id===r.id); return `var(--c${(Math.max(0,i)%12)+1})`; }
function initials(r){
  const w=displayName(r).trim().split(/\s+/).filter(Boolean);
  const first=s=>Array.from(s)[0]||'';
  if(/[ក-៿]/.test(w[0]||'')) return first(w[0]);
  return ((w.length>1?first(w[0])+first(w[w.length-1]):Array.from(w[0]||'?').slice(0,2).join(''))).toUpperCase();
}
function namesList(rs){ return rs.map(r=>esc(displayName(r))).join(', '); }
function traitOfK(k){ return TRAITS.find(t=>t.k===k); }
// dots on a 0–10 line; dots that would overlap stack into extra rows
function dotField(entries, cls, avgV){
  const ROW=30, rows=[];
  const placed=[...entries].sort((a,b)=>a.v-b.v).map(e=>{ let row=rows.findIndex(last=>e.v-last>=0.9); if(row<0){ rows.push(e.v); row=rows.length-1; } else rows[row]=e.v; return {...e,row}; });
  const h=Math.max(1,rows.length)*ROW;
  return `<div class="${cls}" style="height:${h}px">
    <span class="rail" style="top:${ROW/2-2}px"></span>
    ${avgV!=null?`<span class="avgline" style="left:calc(${avgV*10}% - 1px);top:-4px;height:${h+8}px"></span>`:''}
    ${placed.map(e=>`<button class="pdot${e.r.id===myId?' me':''}" data-goto="${esc(e.r.id)}" style="left:${e.v*10}%;top:${e.row*ROW+2}px;background:${colorOf(e.r)}" title="${esc(displayName(e.r))} · ${e.v.toFixed(1)}" aria-label="${esc(displayName(e.r))} ${e.v.toFixed(1)}">${esc(initials(e.r))}</button>`).join('')}
  </div>`;
}
function peopleKey(list){ return `<div class="people-key">${byName(list).map(r=>`<span><i style="background:${colorOf(r)}"></i>${esc(displayName(r))}${r.id===myId?` <small>(${one('you','អ្នក')})</small>`:''}</span>`).join('')}</div>`; }

function teamInsights(list){
  const avg=avgScores(list), n=list.length, out={leans:[],gaps:[],thin:[],pull:[]};
  for(const t of TRAITS){
    const a=avg[t.k];
    if(a>=HI) out.leans.push({t,end:'hi',a}); else if(a<=LO) out.leans.push({t,end:'lo',a});
    const hi=list.filter(r=>r.scores[t.k]>=HI), lo=list.filter(r=>r.scores[t.k]<=LO);
    if(n>=3){
      if(!hi.length) out.gaps.push({t,end:'hi'}); else if(hi.length===1) out.thin.push({t,end:'hi',r:hi[0]});
      if(!lo.length) out.gaps.push({t,end:'lo'}); else if(lo.length===1) out.thin.push({t,end:'lo',r:lo[0]});
    }
  }
  if(!out.leans.length){ const t=[...TRAITS].sort((x,y)=>Math.abs(avg[y.k]-5)-Math.abs(avg[x.k]-5))[0]; if(Math.abs(avg[t.k]-5)>=1) out.leans.push({t,end:avg[t.k]>5?'hi':'lo',a:avg[t.k],soft:true}); }
  const withJob=list.filter(r=>r.jobScores);
  if(withJob.length){
    for(const t of TRAITS){ const g=withJob.reduce((s,r)=>s+(r.jobScores[t.k]-r.scores[t.k]),0)/withJob.length; if(Math.abs(g)>=1.5) out.pull.push({t,g:Math.round(g*10)/10}); }
    out.pull.sort((x,y)=>Math.abs(y.g)-Math.abs(x.g));
  }
  out.withJob=withJob.length;
  return out;
}
const endEn = (t,end)=>end==='hi'?t.hi[0]:t.lo[0], endKm=(t,end)=>end==='hi'?t.hi[1]:t.lo[1];

function laneFilterHTML(){
  const counts = k => results.filter(r=>laneOf(r.lane).k===k).length;

}

function vShape(){

    `<b>${x.t.en}</b>: ${endEn(x.t,x.end).toLowerCase()} (average ${x.a.toFixed(1)})`,

  if(ins.gaps.length) cards.push(`<div class="insight blind"><div class="ih">${one('Nobody naturally brings this','គ្មាននរណាម្នាក់មានលក្ខណៈនេះតាមធម្មជាតិ')}</div><ul>${ins.gaps.map(x=>li(
    `“${endEn(x.t,x.end)}” <small>(${x.t.en} ${x.end==='hi'?'high':'low'})</small>`,

    <p class="note" style="margin-top:6px">${one('A blind spot to cover on purpose: by a habit, a checklist, a volunteer or a partner.','ចំណុចខ្វះខាតដែលត្រូវបំពេញដោយចេតនា៖ តាមទម្លាប់ បញ្ជីត្រួតពិនិត្យ អ្នកស្ម័គ្រចិត្ត ឬដៃគូ។')}</p></div>`);
  if(ins.thin.length) cards.push(`<div class="insight blind" style="border-left-style:dashed"><div class="ih">${one('Only one person carries this','មានតែម្នាក់គត់ដែលមានលក្ខណៈនេះ')}</div><ul>${ins.thin.map(x=>li(
    `“${endEn(x.t,x.end)}”: ${esc(displayName(x.r))}`,
    `«${endKm(x.t,x.end)}»៖ ${esc(displayName(x.r))}`)).join('')}</ul></div>`);
  if(ins.pull.length) cards.push(`<div class="insight job"><div class="ih">${one(`Where our jobs stretch us most (${ins.withJob} with a job profile)`,`កន្លែងដែលការងារទាញយើងខ្លាំងបំផុត (${ins.withJob} នាក់មានទម្រង់ការងារ)`)}</div><ul>${ins.pull.slice(0,3).map(x=>li(
    `<b>${x.t.en}</b>: jobs ask for ${x.g>0?'more':'less'} than people naturally bring (${fmtGap(x.g)} on average), toward “${(x.g>0?x.t.hi[0]:x.t.lo[0]).toLowerCase()}”`,
    `<b>${x.t.km}</b>៖ ការងារតម្រូវ${x.g>0?'ច្រើន':'តិច'}ជាងលក្ខណៈធម្មជាតិ (${fmtGap(x.g)} ជាមធ្យម) ទៅរក «${x.g>0?x.t.hi[1]:x.t.lo[1]}»`)).join('')}</ul></div>`);
  if(list.length<3) cards.push(`<p class="note">${one('Blind spots show once three or more people have taken it.','ចំណុចខ្វះខាតនឹងបង្ហាញ ពេលមានមនុស្សបីនាក់ ឬច្រើនជាងនេះបានធ្វើរួច។')}</p>`);
  return `${laneFilterHTML()}
  <div class="lede">${L(`Each dot is one person (${list.length}). The dark line is the team average. Tap a dot to open that person.`,`ចំណុចនីមួយៗគឺមនុស្សម្នាក់ (${list.length} នាក់)។ បន្ទាត់ខ្មៅគឺមធ្យមភាគក្រុម។ ចុចលើចំណុច ដើម្បីបើកមើលមនុស្សនោះ។`)}</div>
  <div class="insights">${cards.join('')}</div>
  <div class="strips">${TRAITS.map(t=>{
    const lo=byName(list.filter(r=>r.scores[t.k]<=LO)), hi=byName(list.filter(r=>r.scores[t.k]>=HI));
    return `<div class="strip">
      <div class="bar-h"><span class="nm">${L(t.en,t.km)}</span><span class="sc" style="font-size:15px">${one('avg','មធ្យម')} ${avg[t.k].toFixed(1)}</span></div>

    </div>`; }).join('')}</div>
  ${peopleKey(list)}
  <p class="note">${L(`Natural profile (part 1, or the Traits chart for Culture Index). Names under a line are people at ${LO} or below, or ${HI} or above. Different is not better or worse: a team needs both ends of most traits.`,

}

function pickedForCompare(){
  let ids=compareIds.filter(id=>results.some(r=>r.id===id));
  if(!ids.length){ const sorted=byName(results); const me=sorted.find(r=>r.id===myId); ids=[...(me?[me]:[]),...sorted.filter(r=>r.id!==myId)].slice(0,2).map(r=>r.id); }
  compareIds=ids; return ids.map(id=>results.find(r=>r.id===id));
}
function pairTalk(a,b,key){
  const d=TRAITS.map(t=>({t,va:a[key][t.k],vb:b[key][t.k]})).map(x=>({...x,diff:Math.abs(x.va-x.vb)})).sort((x,y)=>y.diff-x.diff);
  const both=TRAITS.filter(t=>a[key][t.k]>=HI&&b[key][t.k]>=HI);
  const A=esc(displayName(a)), B=esc(displayName(b)), lines=[];
  const top=d[0];
  if(top.diff>=3){
    const [hiP,loP,hv,lv]=top.va>top.vb?[A,B,top.va,top.vb]:[B,A,top.vb,top.va];
    lines.push(one(`<b>${A} and ${B}</b> differ most on <b>${top.t.en}</b> (${hv.toFixed(1)} vs ${lv.toFixed(1)}). ${hiP} leans “${top.t.hi[0].toLowerCase()}”, ${loP} leans “${top.t.lo[0].toLowerCase()}”. That can be a strength if you agree who carries what, and friction if you don’t.`,
      `<b>${A} និង ${B}</b> ខុសគ្នាខ្លាំងបំផុតលើ <b>${top.t.km}</b> (${hv.toFixed(1)} ទល់នឹង ${lv.toFixed(1)})។ ${hiP} មានទំនោរ «${top.t.hi[1]}» ហើយ ${loP} មានទំនោរ «${top.t.lo[1]}»។ នេះអាចជាកម្លាំង បើយល់ព្រមគ្នាថាអ្នកណាទទួលខុសត្រូវអ្វី ប៉ុន្តែអាចបង្កការប៉ះទង្គិច បើមិនបានយល់ព្រម។`));
  } else {
    lines.push(one(`<b>${A} and ${B}</b> are close on every trait (no difference of 3 or more). Easy to work together, but you may share the same blind spots.`,
      `<b>${A} និង ${B}</b> ស្រដៀងគ្នាលើគ្រប់លក្ខណៈ (គ្មានភាពខុសគ្នាដល់ ៣)។ ងាយធ្វើការជាមួយគ្នា ប៉ុន្តែប្រហែលជាមានចំណុចខ្វះខាតដូចគ្នា។`));
  }
  if(both.length) lines.push(one(`Shared strength: ${both.map(t=>`<b>${t.en}</b>`).join(', ')}.`,`កម្លាំងរួម៖ ${both.map(t=>`<b>${t.km}</b>`).join(', ')}។`));
  return `<li>${lines.join(' ')}</li>`;
}
function vCompare(){

  </div>
  ${missing.length?`<p class="note">${one(`No job profile yet for ${namesList(missing)}.`,`មិនទាន់មានទម្រង់ការងារសម្រាប់ ${namesList(missing)}។`)}</p>`:''}
  ${shown.length?`<div class="strips">${TRAITS.map(t=>`<div class="strip">
      <div class="bar-h"><span class="nm">${L(t.en,t.km)}</span></div>
      ${dotField(shown.map(r=>({r,v:r[key][t.k]})),'strip-field',null)}
      <div class="ends"><span>${one(t.lo[0],t.lo[1])}</span><span>${one(t.hi[0],t.hi[1])}</span></div>
      <div class="cmp-nums">${shown.map(r=>`<span><i style="background:${colorOf(r)}"></i>${esc(displayName(r).split(/\s+/)[0])} ${r[key][t.k].toFixed(1)}</span>`).join('')}</div>
    </div>`).join('')}</div>`:''}
  ${pairs.length?`<h3 style="margin-top:26px">${L('Things to talk about','ចំណុចដែលគួរជជែកគ្នា')}</h3><ul class="talk">${pairs.map(([a,b])=>pairTalk(a,b,key)).join('')}</ul>`:''}
  <p class="note">${L('Use this to plan how you work together, not to rank anyone.','ប្រើវាដើម្បីរៀបចំរបៀបធ្វើការជាមួយគ្នា មិនមែនដើម្បីដាក់ចំណាត់ថ្នាក់នរណាម្នាក់ទេ។')}</p>`;
}

function vTeam(){
  if(!db){
    return `<h2>${L('Team results','លទ្ធផលក្រុម')}</h2><div class="empty">${dbState==='connecting'
      ? L('Loading…','កំពុងផ្ទុក…')
      : L('Enter the team code to see team results.','សូមបញ្ចូលលេខកូដក្រុម ដើម្បីមើលលទ្ធផលក្រុម។')}</div>`;
  }
  const tabs = `<div class="filters tabs" role="group">
    <button data-tab="shape" aria-pressed="${teamTab==='shape'}">${one('Team shape','រូបរាងក្រុម')}</button>
    <button data-tab="people" aria-pressed="${teamTab==='people'}">${one('People','មនុស្ស')}</button>
    <button data-tab="compare" aria-pressed="${teamTab==='compare'}">${one('Compare','ប្រៀបធៀប')}</button>
    <button data-tab="lanes" aria-pressed="${teamTab==='lanes'}">${one('Lanes and job fit','ផ្នែក និងភាពស៊ីគ្នាការងារ')}</button>
  </div>`;
  if(!results.length) return `<h2>${L('Team results','លទ្ធផលក្រុម')}</h2><div class="empty">${L('No results yet. Be the first.','មិនទាន់មានលទ្ធផលនៅឡើយ។ សូមធ្វើជាមុនគេ។')}<div class="btn-col"><button class="btn" data-act="start">${L('Start','ចាប់ផ្តើម')}</button></div></div>`;
  if(teamTab==='lanes') return `<h2>${L('Team results','លទ្ធផលក្រុម')}</h2>${tabs}${vLanes()}`;
  if(teamTab==='shape') return `<h2>${L('Team results','លទ្ធផលក្រុម')}</h2>${tabs}${vShape()}`;
  if(teamTab==='compare') return `<h2>${L('Team results','លទ្ធផលក្រុម')}</h2>${tabs}${vCompare()}`;

  let list = results.filter(r=>teamFilter==='all'||laneOf(r.lane).k===teamFilter);
  const fitOf = r => fitFor(laneOf(r.lane), r.scores);
  list = teamSort==='stretch' ? list.sort((a,b)=>totalGap(b)-totalGap(a))
    : teamSort==='fit' ? list.sort((a,b)=>(fitOf(a)?.pct??999)-(fitOf(b)?.pct??999))
    : list.sort((a,b)=>displayName(a).localeCompare(displayName(b)));
  const avg = avgScores(list);
  const counts = k => results.filter(r=>laneOf(r.lane).k===k).length;
  const stretched = list.filter(r=>maxGap(r)>=BIG_GAP).length;
  return `
  <h2>${L('Team results','លទ្ធផលក្រុម')}</h2>
  ${tabs}
  ${dbState==='slow'?`<p class="note">${L('Still connecting. Results will appear when the connection returns.','កំពុងភ្ជាប់។ លទ្ធផលនឹងបង្ហាញ ពេលការតភ្ជាប់ដំណើរការវិញ។')}</p>`:''}
  <div class="filters" role="group">
    <button data-filter="all" aria-pressed="${teamFilter==='all'}">${one('Everyone','ទាំងអស់')} ${results.length}</button>
    ${[...LANES,UNSET].filter(c=>counts(c.k)).map(c=>`<button data-filter="${c.k}" aria-pressed="${teamFilter===c.k}">${one(c.en,c.km)} ${counts(c.k)}</button>`).join('')}
  </div>
  ${list.length?`
  <div class="avgcard">
    <div>${L('Group average','មធ្យមភាគក្រុម')}<span class="s">${list.length} ${one(list.length===1?'person':'people','នាក់')}${stretched?` · ${stretched} ${one('with a big job stretch','មានការប្រឹងប្រែងខ្លាំងក្នុងការងារ')}`:''}</span></div>
    <div>${sigHTML(avg,true)}</div>
  </div>
  <div class="sortbar" role="group">${one('Sort:','តម្រៀប៖')}
    <button data-sort="name" aria-pressed="${teamSort==='name'}">${one('Name','ឈ្មោះ')}</button>
    <button data-sort="fit" aria-pressed="${teamSort==='fit'}">${one('Lowest lane fit','ស៊ីគ្នាតិចបំផុត')}</button>
    <button data-sort="stretch" aria-pressed="${teamSort==='stretch'}">${one('Biggest job stretch','ប្រឹងប្រែងខ្លាំងបំផុត')}</button>
  </div>
  <ul class="people">${list.map(r=>{ const f=fitOf(r); const lane=laneOf(r.lane); return `<li id="row-${esc(r.id)}">
    <button class="row" data-open="${esc(r.id)}" aria-expanded="${openId===r.id}">
      <span class="who"><b>${esc(displayName(r))}${srcTag(r)}${r.id===myId?` <small>(${one('you','អ្នក')})</small>`:''}</b><small>${esc(one(lane.en,lane.km))}${r.role?' · '+esc(r.role):''}</small>
        ${f?fitPill(f.pct):''}${maxGap(r)>=BIG_GAP?` <span class="stretch-badge">${one('Big job stretch','ប្រឹងប្រែងខ្លាំង')}</span>`:''}</span>
      ${sigHTML(r.scores)}
    </button>
    ${openId===r.id?`<div class="detail">
      <div class="meta">${one('Updated','កែប្រែចុងក្រោយ')} ${new Date(r.updatedAt||0).toLocaleDateString(lang==='km'?'km-KH':'en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
      ${fitHTML(r)}
      ${summaryHTML(r)}
      ${barsHTML(r, list.length>1?avg:null)}
      ${isOwner?`<div class="owner-tools"><button class="small-btn danger" data-del="${esc(r.id)}">${confirmDel===r.id?one('Tap again to delete','ចុចម្តងទៀតដើម្បីលុប'):one('Delete result','លុបលទ្ធផល')}</button></div>`:''}
    </div>`:''}
  </li>`; }).join('')}</ul>
  <p class="note">${L(`The percentage shows how closely each person’s natural profile matches what their lane’s job description asks for. The six bars are the natural profile in this order: Initiative, People energy, Pace, Structure, Logic, Creativity. “Big job stretch” means their current job asks for a difference of ${BIG_GAP} or more on at least one trait.`,
    `ភាគរយបង្ហាញថា ទម្រង់ធម្មជាតិរបស់ម្នាក់ៗ ស៊ីគ្នាប៉ុណ្ណាជាមួយអ្វីដែលការពិពណ៌នាការងារនៃផ្នែករបស់គេតម្រូវ។ របារទាំង ៦ គឺជាទម្រង់ធម្មជាតិ តាមលំដាប់៖ ការផ្តួចផ្តើម ភាពរួសរាយ ល្បឿនការងារ ភាពម៉ត់ចត់ ការគិតតាមហេតុផល ភាពច្នៃប្រឌិត។ «ប្រឹងប្រែងខ្លាំង» មានន័យថា ការងារបច្ចុប្បន្នតម្រូវឲ្យខុសពីធម្មជាតិ ${BIG_GAP} ឬលើសនោះ យ៉ាងហោចណាស់លើចំណុចមួយ។`)}</p>
  ${isOwner && downloads?`<div class="owner-tools"><button class="small-btn" data-act="csv">${one('Download results (CSV)','ទាញយកលទ្ធផល (CSV)')}</button></div>`:''}
  `:''}`;
}

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  const app=$('#app');
  if(view==='take') app.innerHTML = stage==='info'?vInfo():stage==='ci'?vCI():stage==='break'?vBreak():vQuestion(stage==='q1'?1:2);
  else if(view==='mine') app.innerHTML = vMine();
  else if(view==='team') app.innerHTML = vTeam();
  else app.innerHTML = vHome();
  if(view!=='home'){ app.insertAdjacentHTML('afterbegin', `<button class="back" data-act="back">‹ ${one('Back','ថយក្រោយ')}</button>`); }
  const nm=$('#nm'); if(nm){ nm.addEventListener('input',e=>{form.name=e.target.value; syncBegin(); syncCISave();}); }
  const rl=$('#rl'); if(rl){ rl.addEventListener('input',e=>{form.role=e.target.value;}); }
  const cf=$('#cifile'); if(cf){ cf.addEventListener('change',e=>{ ciFile=e.target.files?.[0]||null; if(ciFile) readReport(); }); }
  const fo=$('#fo'); if(fo){ fo.addEventListener('change',e=>{form.forOther=e.target.checked; if(form.forOther){form.name='';form.role='';} render(); }); }
}
function syncBegin(){ const b=document.querySelector('[data-act="begin"]'); if(b) b.disabled=!(form.name.trim()&&form.lane); }

/* ---------- events ---------- */
document.addEventListener('input', e=>{ const k=e.target?.dataset?.ci; if(!k) return; const [g,l]=k.split('.'); if(l) ci[g][l]=e.target.value; else ci[g]=e.target.value; syncCISave(); });
document.addEventListener('click', async e=>{
  const el = e.target.closest('button'); if(!el) return;
  if(el.id==='homeBtn'){ go('home'); return; }
  if(el.dataset.lang){ lang=el.dataset.lang; render(); return; }
  if(el.dataset.lane){ form.lane=el.dataset.lane; document.querySelectorAll('[data-lane]').forEach(b=>b.setAttribute('aria-pressed',b===el)); syncBegin(); syncCISave(); return; }
  if(el.dataset.ans){
    const arr = stage==='q1'?answers:jobAnswers;
    arr[qi]=+el.dataset.ans;
    if(qi<ITEMS.length-1){ render(); setTimeout(()=>{ qi++; render(); },180); } else render();
    return;
  }
  if(el.dataset.filter){ teamFilter=el.dataset.filter; openId=null; render(); return; }
  if(el.dataset.sort){ teamSort=el.dataset.sort; render(); return; }
  if(el.dataset.cmp){ const id=el.dataset.cmp; compareIds = compareIds.includes(id) ? compareIds.filter(x=>x!==id) : [...compareIds,id].slice(-4); if(!compareIds.length) compareIds=[id]; render(); return; }
  if(el.dataset.cmode){ compareMode=el.dataset.cmode; render(); return; }
  if(el.dataset.tab){ teamTab=el.dataset.tab; render(); return; }
  if(el.dataset.goto){ teamTab='people'; teamFilter='all'; openId=el.dataset.goto; render(); const row=document.getElementById('row-'+el.dataset.goto); if(row) row.scrollIntoView({block:'start'}); return; }
  if(el.dataset.open){ openId = openId===el.dataset.open?null:el.dataset.open; confirmDel=null; render(); return; }
  if(el.dataset.del){
    if(confirmDel!==el.dataset.del){ confirmDel=el.dataset.del; render(); return; }
    try{ await db.collection('results').doc(el.dataset.del).delete(); openId=null; }catch(err){ alertNote(one('Could not delete this result.','មិនអាចលុបលទ្ធផលនេះបានទេ។')); }
    confirmDel=null; render(); return;
  }
  const act=el.dataset.act;
  if(act==='back'){ back(); }
  else if(act==='start'){ startTake(); }
  else if(act==='team'){ go('team'); }
  else if(act==='mine'){ lastResult=null; saveState=null; go('mine'); }
  else if(act==='begin'){ if(form.name.trim()&&form.lane){ stage='q1'; qi=0; render(); window.scrollTo(0,0);} }
  else if(act==='start-ci'){ await startTake(); stage='ci'; render(); }
  else if(act==='ci-edit'){ ciEdit=!ciEdit; render(); }
  else if(act==='ci-save'){ await saveCI(); }
  else if(act==='to-break'){ stage='break'; render(); window.scrollTo(0,0); }
  else if(act==='begin2'){ stage='q2'; qi=0; render(); window.scrollTo(0,0); }
  else if(act==='prev'){ back(); }
  else if(act==='next'){ if(qi<ITEMS.length-1){qi++; render();} }
  else if(act==='finish'){ await finish(); }
  else if(act==='next-person'){ form={name:'',lane:'',role:'',forOther:true}; const wasCI=lastResult?.source==='ci'; ci=blankCI(); ciFile=null; ciStatus=null; ciEdit=false; answers.fill(null); jobAnswers.fill(null); qi=0; stage=wasCI?'ci':'info'; lastResult=null; saveState=null; go('take'); }
  else if(act==='csv'){ exportCSV(); }
});
function alertNote(msg){ const p=document.createElement('p'); p.className='saved warn'; p.textContent=msg; $('#app').prepend(p); setTimeout(()=>p.remove(),4000); }

async function startTake(){
  form.forOther=false;
  answers.fill(null); jobAnswers.fill(null); qi=0; stage='info'; ci=blankCI(); ciFile=null; ciStatus=null;
  const mine = results.find(r=>r.id===myId);
  if(!form.forOther){
    if(mine){ form.name=mine.name||''; form.lane=mine.lane||''; form.role=mine.role||''; }
    else if(user && !form.name){ try{ const me=await user.me(); if(me?.name) form.name=me.name; }catch(e){} }
  }
  go('take');
}

async function finish(){
  const rec={name:form.name.trim().slice(0,60), lane:form.lane, role:form.role.trim().slice(0,60),
    scores:score(answers), jobScores:score(jobAnswers), answers:[...answers], jobAnswers:[...jobAnswers], updatedAt:Date.now()};
  const id = form.forOther ? ('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)) : myId;
  lastResult={id:id||'local',...rec};
  saveState='local';
  if(db && id){
    try{ await db.collection('results').doc(id).set(rec); saveState='saved'; }
    catch(err){ saveState='failed'; }
  }
  go('mine');
}

async function exportCSV(){
  const head=['Name','Source','CI pattern','Lane','Other role','Updated','Lane fit %',...TRAITS.map(t=>t.en+' (natural)'),...TRAITS.map(t=>t.en+' (job)'),...TRAITS.map(t=>t.en+' (gap)'),...ITEMS.map((_,i)=>'P1 Q'+(i+1)),...ITEMS.map((_,i)=>'P2 Q'+(i+1))];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=results.map(r=>{ const g=gaps(r)||{}; return [r.name,r.source==='ci'?'Culture Index':'Survey',r.ci?.pattern||'',laneOf(r.lane).en,r.role,new Date(r.updatedAt||0).toISOString().slice(0,10),fitFor(laneOf(r.lane),r.scores)?.pct??'',
    ...TRAITS.map(t=>r.scores?.[t.k]),...TRAITS.map(t=>r.jobScores?.[t.k]??''),...TRAITS.map(t=>g[t.k]??''),
    ...(r.answers||ITEMS.map(()=>'')),...(r.jobAnswers||ITEMS.map(()=>''))].map(q).join(','); });
  const csv='\ufeff'+[head.map(q).join(','),...rows].join('\n');
  try{ await downloads.save({filename:'gp-work-style-results.csv', data:csv}); }catch(e){}
}

/* ---------- runtime ---------- */
(async()=>{
  const h=location.hash.slice(1);
  if(['team','mine'].includes(h)) view=h;
  render();
  if(!window.claude || !window.claude.use){ dbState='none'; render(); return; }
  try{ user = await window.claude.use('user'); }catch(e){}
  if(user){ try{ myId = await user.id(); }catch(e){} try{ isOwner = !!(await user.isOwner()); }catch(e){} }
  try{ downloads = await window.claude.use('downloads'); }catch(e){}
  try{ db = await window.claude.use('db'); }catch(e){}
  try{ sample = await window.claude.use('sample'); if(sample){ const lim = await sample.limits().catch(()=>null); canImages = !!lim?.images; if(view==='take'&&stage==='ci') render(); } }catch(e){}
  if(!db){ dbState='none'; render(); return; }
  let loaded=false;
  const timer=setTimeout(()=>{ if(!loaded){ dbState='slow'; render(); } },10000);
  db.collection('results').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ loaded=true; clearTimeout(timer); dbState='ok'; }
    results = snap.docs.filter(d=>d.exists!==false).map(d=>({id:d.id,...(d.data()||{})})).filter(r=>r.scores);
    if(view!=='take') render();
  }, err=>{ clearTimeout(timer); dbState='none'; render(); });
})();


</script>
</body>
</html>
